<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crow Platform · Audit</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #18202a; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #111820; color: white; padding: 18px 28px; display: flex; justify-content: space-between; gap: 16px; }
    nav a { color: #dce4ea; text-decoration: none; margin-left: 14px; }
    main { max-width: 1220px; margin: 0 auto; padding: 34px 24px 72px; }
    .card { background: white; border: 1px solid #dce2e8; border-radius: 12px; padding: 18px; margin: 12px 0; }
    .muted { color: #647180; }
    .row { display: grid; grid-template-columns: 190px 170px 1fr; gap: 16px; align-items: start; }
    code { white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <strong>CROW PLATFORM · AUDIT</strong>
    <nav><a href="/admin">Admin</a><a href="/admin/users">Användare</a><a href="/app">Min Crow</a></nav>
  </header>
  <main>
    <h1>Administrativ audit trail</h1>
    <p class="muted">Senaste administrativa förändringar. Loggen är append-only och visar inte lösenord, hash eller salt.</p>
    <div id="events"><p class="muted">Laddar…</p></div>
  </main>
  <script>
    const events = document.getElementById("events");
    const esc = value => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    async function boot() {
      const response = await fetch("/api/admin/audit?limit=500");
      if (response.status === 401) { location.replace("/login"); return; }
      if (response.status === 403) { location.replace("/app"); return; }
      const payload = await response.json();
      if (!response.ok) { events.innerHTML = `<div class="card">${esc(payload.detail || "Kunde inte läsa auditloggen")}</div>`; return; }
      if (!payload.events.length) { events.innerHTML = '<div class="card muted">Inga audit-händelser ännu.</div>'; return; }
      events.innerHTML = payload.events.map(event => `
        <article class="card row">
          <div><strong>${esc(event.action)}</strong><br><span class="muted">${esc(event.timestamp)}</span></div>
          <div><strong>${esc(event.target_type)}</strong><br>${esc(event.target_id)}<br><span class="muted">${esc(event.customer_id || "")}</span></div>
          <div><div class="muted">Aktör: ${esc(event.actor_user_id || "lokal admin")}</div><code>${esc(JSON.stringify({before: event.before, after: event.after}, null, 2))}</code></div>
        </article>`).join("");
    }
    boot();
  </script>
</body>
</html>

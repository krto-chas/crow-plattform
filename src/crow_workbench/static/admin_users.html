<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Användare · Crow Platform</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #18202a; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #111820; color: white; padding: 18px 28px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    header a { color: #dce4ea; text-decoration: none; margin-left: 14px; }
    main { max-width: 1180px; margin: 0 auto; padding: 34px 24px 72px; }
    h1 { margin: 0 0 8px; }
    .muted { color: #647180; }
    .grid { display: grid; grid-template-columns: minmax(300px, .9fr) minmax(420px, 1.1fr); gap: 20px; margin-top: 24px; }
    .card { background: white; border: 1px solid #dce2e8; border-radius: 12px; padding: 20px; }
    label { display: block; font-weight: 600; margin: 13px 0 6px; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #cbd4dc; border-radius: 8px; font: inherit; background: white; }
    input[type="checkbox"] { width: auto; }
    button { border: 0; border-radius: 8px; padding: 9px 13px; background: #1d5b79; color: white; cursor: pointer; font: inherit; }
    button.secondary { background: #e8edf1; color: #25313d; }
    .user { width: 100%; text-align: left; margin: 0 0 8px; padding: 12px; background: #f7f9fa; color: #25313d; border: 1px solid #dce2e8; }
    .pill { display: inline-block; padding: 3px 8px; margin: 5px 5px 0 0; border-radius: 999px; background: #eef2f5; font-size: 12px; }
    .pill.off { background: #fff0f0; color: #8a2626; }
    .message { margin-top: 14px; padding: 10px; border-radius: 8px; }
    .ok { background: #eef8f0; color: #245f31; }
    .error { background: #fff0f0; color: #8a2626; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <strong>CROW PLATFORM · ANVÄNDARE</strong>
    <nav><a href="/admin">Admin</a><a href="/app">Min Crow</a><a href="/workbench">Workbench</a></nav>
  </header>
  <main>
    <h1>Användare</h1>
    <p class="muted">Skapa användare, koppla dem till kund, styra roller och inaktivera åtkomst. Lösenord lagras aldrig i klartext.</p>
    <div class="grid">
      <section class="card">
        <h2>Konton</h2>
        <div id="users"><p class="muted">Laddar…</p></div>
      </section>
      <section class="card">
        <h2 id="form-title">Skapa användare</h2>
        <form id="user-form">
          <label for="username">Användarnamn</label>
          <input id="username" required pattern="[A-Za-z0-9._-]+">
          <label for="customer">Kund</label>
          <select id="customer" required>
            <option value="">Laddar kunder…</option>
          </select>
          <p class="muted" id="customer-help">Kunder hämtas från Åtkomststyrning.</p>
          <label for="roles">Roller</label>
          <input id="roles" placeholder="platform-admin eller kommaseparerade roller">
          <label for="password">Lösenord</label>
          <input id="password" type="password" minlength="12" autocomplete="new-password">
          <p class="muted" id="password-help">Minst 12 tecken krävs när ett konto skapas.</p>
          <label><input id="active" type="checkbox" checked> Aktiv användare</label>
          <div class="toolbar">
            <button type="submit">Spara</button>
            <button type="button" class="secondary" id="new-user">Nytt konto</button>
          </div>
          <div id="message"></div>
        </form>
      </section>
    </div>
  </main>
  <script>
    const usersRoot = document.getElementById("users");
    const form = document.getElementById("user-form");
    const message = document.getElementById("message");
    const customerSelect = document.getElementById("customer");
    const customerHelp = document.getElementById("customer-help");
    let editing = null;
    let users = [];
    let customers = [];

    async function api(url, options = {}) {
      const response = await fetch(url, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(typeof payload.detail === "string" ? payload.detail : JSON.stringify(payload.detail || payload));
      return payload;
    }

    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function renderCustomerOptions(selected = "") {
      const known = new Set(customers.map(customer => customer.customer_id));
      const options = ['<option value="">Välj kund…</option>'];
      for (const customer of customers) {
        const id = customer.customer_id;
        options.push(`<option value="${escapeHtml(id)}"${id === selected ? " selected" : ""}>${escapeHtml(id)}</option>`);
      }
      if (selected && !known.has(selected)) {
        options.push(`<option value="${escapeHtml(selected)}" selected>${escapeHtml(selected)} (system/admin)</option>`);
      }
      customerSelect.innerHTML = options.join("");
    }

    async function loadCustomers() {
      try {
        customers = (await api("/api/admin/customers")).customers || [];
        renderCustomerOptions(customerSelect.value);
        customerHelp.textContent = customers.length
          ? "Kunder hämtas från Åtkomststyrning."
          : "Inga kunder finns ännu. Skapa kunden under Åtkomststyrning först.";
      } catch (error) {
        customerHelp.textContent = `Kundlistan kunde inte laddas: ${error.message}`;
        throw error;
      }
    }

    async function loadUsers() {
      try {
        users = (await api("/api/admin/users")).users;
        usersRoot.innerHTML = users.map(user => `
          <button class="user" type="button" data-user="${escapeHtml(user.username)}">
            <strong>${escapeHtml(user.username)}</strong> · ${escapeHtml(user.customer_id)}<br>
            ${user.active ? '<span class="pill">aktiv</span>' : '<span class="pill off">inaktiv</span>'}
            ${user.roles.map(role => `<span class="pill">${escapeHtml(role)}</span>`).join("")}
          </button>`).join("") || '<p class="muted">Inga användare är konfigurerade.</p>';
        usersRoot.querySelectorAll("button[data-user]").forEach(button => button.addEventListener("click", () => editUser(button.dataset.user)));
      } catch (error) {
        usersRoot.innerHTML = `<div class="message error">${escapeHtml(error.message)}</div>`;
      }
    }

    function editUser(username) {
      const user = users.find(item => item.username === username);
      if (!user) return;
      editing = user.username;
      document.getElementById("form-title").textContent = `Redigera ${user.username}`;
      document.getElementById("username").value = user.username;
      document.getElementById("username").disabled = true;
      renderCustomerOptions(user.customer_id);
      document.getElementById("roles").value = user.roles.join(", ");
      document.getElementById("password").value = "";
      document.getElementById("password").required = false;
      document.getElementById("password-help").textContent = "Lämna tomt för att behålla nuvarande lösenord.";
      document.getElementById("active").checked = user.active;
      message.innerHTML = "";
    }

    function resetForm() {
      editing = null;
      form.reset();
      renderCustomerOptions();
      document.getElementById("active").checked = true;
      document.getElementById("username").disabled = false;
      document.getElementById("password").required = true;
      document.getElementById("form-title").textContent = "Skapa användare";
      document.getElementById("password-help").textContent = "Minst 12 tecken krävs när ett konto skapas.";
      message.innerHTML = "";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const payload = {
        customer_id: customerSelect.value,
        roles: document.getElementById("roles").value.split(",").map(value => value.trim()).filter(Boolean),
        active: document.getElementById("active").checked
      };
      if (password) payload.password = password;
      try {
        if (editing) {
          await api(`/api/admin/users/${encodeURIComponent(editing)}`, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
        } else {
          payload.username = document.getElementById("username").value;
          if (!password) throw new Error("Lösenord krävs för nya användare");
          await api("/api/admin/users", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
        }
        message.innerHTML = '<div class="message ok">Användaren är sparad.</div>';
        await loadUsers();
        if (!editing) resetForm();
      } catch (error) {
        message.innerHTML = `<div class="message error">${escapeHtml(error.message)}</div>`;
      }
    });

    document.getElementById("new-user").addEventListener("click", resetForm);

    async function initialize() {
      resetForm();
      await Promise.all([loadCustomers(), loadUsers()]);
    }

    initialize().catch(error => {
      message.innerHTML = `<div class="message error">${escapeHtml(error.message)}</div>`;
    });
  </script>
</body>
</html>

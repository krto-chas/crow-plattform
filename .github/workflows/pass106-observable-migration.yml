name: Pass106 observable core migration

on:
  push:
    branches: [pass106-core-vent-decoupling-clean]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[pass106-result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pass106-core-vent-decoupling-clean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Transform, verify, and record result
        shell: bash
        run: |
          set +e
          LOG=/tmp/pass106.log
          : >"$LOG"
          echo 'PHASE transform' >>"$LOG"
          python - <<'PY' >>"$LOG" 2>&1
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("src/crow_workbench/app.py")
          text = app_path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              "from crow_graph_explorer import GraphExplorerBuilder\n",
              dedent("""\
              from crow_graph_explorer import GraphExplorerBuilder
              from crow_graph_rules import (
                  GraphAuditDiffer,
                  GraphAuditProfile,
                  GraphResolutionVerificationService,
                  GraphRule,
                  GraphRuleEngine,
              )
              """),
              "graph rules import",
          )

          vent_start = text.index("from crow_vent import (\n")
          vent_end_marker = "from crow_vent.graph_audit import VENT_GRAPH_RULES\n"
          vent_end = text.index(vent_end_marker, vent_start) + len(vent_end_marker)
          text = text[:vent_start] + text[vent_end:]

          start_marker = "    def serialize_graph_audit(project_id: str) -> dict[str, Any]:\n"
          end_marker = "    def persist_graph_audit(project_id: str) -> tuple[dict[str, Any], bool]:\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise RuntimeError("graph audit function markers are not unique")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          helpers = indent(dedent("""\
          def active_graph_audit_profiles() -> tuple[GraphAuditProfile, ...]:
              raw: Any = getattr(app.state, "crow_graph_audit_profiles", ())
              if not isinstance(raw, tuple):
                  return ()
              return tuple(item for item in raw if isinstance(item, GraphAuditProfile))

          def active_graph_rules() -> tuple[GraphRule, ...]:
              return tuple(
                  rule
                  for profile in active_graph_audit_profiles()
                  for rule in profile.rules
              )

          def graph_audit_identity() -> tuple[str, str]:
              profiles = active_graph_audit_profiles()
              if len(profiles) == 1:
                  profile = profiles[0]
                  return profile.audit_prefix, profile.ruleset_version
              if not profiles:
                  return "graph", "none"
              key = "|".join(
                  sorted(
                      f"{profile.profile_id}@{profile.ruleset_version}"
                      for profile in profiles
                  )
              )
              version = f"composite-{sha256(key.encode('utf-8')).hexdigest()[:12]}"
              return "graph", version

          def graph_audit_pattern() -> str:
              prefix, _ = graph_audit_identity()
              return f"{prefix}-audit-*.json"

          def serialize_graph_audit(project_id: str) -> dict[str, Any]:
              graph = building_graph_repository(project_id).load()
              profiles = active_graph_audit_profiles()
              result = GraphRuleEngine().evaluate(graph, active_graph_rules())
              summary = dict(result.summary)
              for profile in profiles:
                  for category in profile.summary_categories:
                      summary.setdefault(category, 0)
              graph_payload = json.dumps(
                  graph, sort_keys=True, separators=(",", ":"), ensure_ascii=False
              )
              graph_checksum = sha256(graph_payload.encode("utf-8")).hexdigest()
              _, ruleset_version = graph_audit_identity()
              metadata = dict(result.metadata)
              for profile in profiles:
                  metadata.update(profile.metadata)
              metadata.update(
                  {
                      "rule_version": ruleset_version,
                      "profiles": [profile.profile_id for profile in profiles],
                  }
              )
              return {
                  "project_id": _safe_project_id(project_id),
                  "graph_checksum": graph_checksum,
                  "summary": summary,
                  "metadata": metadata,
                  "findings": [_jsonable(asdict(item)) for item in result.findings],
              }
          """), "    ")
          text = text[:start] + helpers + "\n" + text[end:]

          text = replace_once(
              text,
              '        audit_id = f"vent:audit:{sha256(audit_key.encode(\'utf-8\')).hexdigest()[:20]}"\n',
              '        audit_prefix, _ = graph_audit_identity()\n'
              '        audit_id = f"{audit_prefix}:audit:{sha256(audit_key.encode(\'utf-8\')).hexdigest()[:20]}"\n',
              "graph audit id",
          )
          if text.count('"vent-audit-*.json"') != 8:
              raise RuntimeError(f"vent audit globs: expected 8, found {text.count(chr(34) + 'vent-audit-*.json' + chr(34))}")
          text = text.replace('"vent-audit-*.json"', "graph_audit_pattern()")
          text = replace_once(text, "len(VENT_GRAPH_RULES) + 4", "len(active_graph_rules()) + 4", "rule count")
          text = replace_once(text, "(*VENT_GRAPH_RULES, *evidence_rules)", "(*active_graph_rules(), *evidence_rules)", "rule explorer")
          if text.count("VentAuditDiffer()") != 2:
              raise RuntimeError(f"VentAuditDiffer count={text.count('VentAuditDiffer()')}")
          text = text.replace("VentAuditDiffer()", "GraphAuditDiffer()")
          text = replace_once(
              text,
              "VentResolutionVerificationService().decide(",
              "GraphResolutionVerificationService(namespace=graph_audit_identity()[0]).decide(",
              "resolution verifier",
          )
          text = replace_once(
              text,
              '"review_id": f"vent:finding-review:{review_digest}",',
              '"review_id": f"{graph_audit_identity()[0]}:finding-review:{review_digest}",',
              "review id",
          )

          legacy = '    @app.get("/api/vent/registry")\n'
          return_marker = "    return app\n\n\napp = create_app()"
          if text.count(legacy) != 1 or text.count(return_marker) != 1:
              raise RuntimeError("legacy route block markers are not unique")
          legacy_start = text.index(legacy)
          legacy_end = text.index(return_marker, legacy_start)
          text = text[:legacy_start] + text[legacy_end:]

          for forbidden in (
              "from crow_vent", "import crow_vent", "VENT_GRAPH_RULES", "VentGraphAudit",
              "VentAuditDiffer", "VentResolutionVerificationService", "build_vent_model",
              "component_registry", "quantity_takeoff_csv", '@app.get("/api/vent/registry")',
              '@app.get("/api/projects/{project_id}/vent/{checksum}")',
              '@app.post("/api/projects/{project_id}/takeoff")',
              '@app.get("/api/projects/{project_id}/vent/{checksum}/quantity.csv")',
              '@app.get("/api/projects/{project_id}/vent/{checksum}/review")',
          ):
              if forbidden in text:
                  raise RuntimeError(f"forbidden dependency remains: {forbidden}")
          app_path.write_text(text, encoding="utf-8")

          workbench = Path("tests/test_workbench.py")
          text = workbench.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from fastapi.testclient import TestClient\n\nfrom crow_workbench.app import create_app\n",
              dedent("""\
              from fastapi import FastAPI
              from fastapi.testclient import TestClient

              from crow_vent_module.plugin import CrowVentModulePlugin
              from crow_workbench.app import create_app as create_core_app


              def create_app(data_root: Path) -> FastAPI:
                  app = create_core_app(data_root)
                  app.state.crow_graph_audit_profiles = CrowVentModulePlugin().graph_audit_profiles()
                  return app
              """),
              "workbench test factory",
          )
          workbench.write_text(text, encoding="utf-8")

          canonical = Path("tests/test_crow_canonical.py")
          text = canonical.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from crow_canonical import CanonicalGraphBridge, CanonicalObjectType, VentCanonicalAdapter\n",
              "from crow_canonical import CanonicalGraphBridge, CanonicalObjectType\n",
              "canonical adapter import",
          )
          text = replace_once(
              text,
              "from crow_vent import VentTextInterpreter\n",
              "from crow_vent import VentCanonicalAdapter, VentCanonicalAssembler, VentTextInterpreter\n",
              "module Vent imports",
          )
          text = text.replace("    from crow_canonical import VentCanonicalAssembler\n\n", "")
          text = text.replace("        VentCanonicalAssembler,\n", "")
          text = text.replace(
              "    from crow_canonical import CanonicalProvenanceService, VentCanonicalAdapter\n",
              "    from crow_canonical import CanonicalProvenanceService\n",
          )
          canonical.write_text(text, encoding="utf-8")

          adapter = Path("src/crow_canonical/vent_adapter.py")
          if not adapter.exists():
              raise RuntimeError("legacy canonical Vent adapter missing before migration")
          adapter.unlink()
          print("transform ok")
          PY
          RC=$?

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE py_compile' >>"$LOG"
            python -m py_compile src/crow_workbench/app.py src/crow_workbench/shell.py >>"$LOG" 2>&1
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE install' >>"$LOG"
            python -m pip install --upgrade pip >>"$LOG" 2>&1 && \
            python -m pip install -e ".[dev]" >>"$LOG" 2>&1
            RC=$?
            if [ "$RC" -eq 0 ]; then
              for module in modules/*; do
                if [ -f "$module/pyproject.toml" ]; then
                  python -m pip install -e "$module" >>"$LOG" 2>&1 || { RC=$?; break; }
                fi
              done
            fi
          fi

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE format' >>"$LOG"
            ruff format src/crow_workbench/app.py tests/test_workbench.py tests/test_crow_canonical.py >>"$LOG" 2>&1
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE ruff' >>"$LOG"
            ruff check src/crow_workbench/app.py tests/test_workbench.py tests/test_crow_canonical.py src/crow_graph_rules src/crow_module_sdk/web.py src/crow_workbench/shell.py src/crow_canonical src/crow_cad_text modules/crow-vent-module/src/crow_vent modules/crow-vent-module/src/crow_vent_module/plugin.py tests/test_core_without_vent.py tests/test_graph_audit_runtime.py tests/test_module_web_extensions.py tests/test_rule_explorer.py tests/test_crow_cad_text.py >>"$LOG" 2>&1
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE core-import-boundary' >>"$LOG"
            if grep -R --include='*.py' -nE '(^|[[:space:]])(from|import)[[:space:]]+crow_vent' src >>"$LOG" 2>&1; then
              echo 'unexpected crow_vent import remains under src/' >>"$LOG"
              RC=1
            fi
          fi

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE focused-tests' >>"$LOG"
            pytest -q tests/test_core_without_vent.py tests/test_graph_audit_runtime.py tests/test_module_web_extensions.py tests/test_rule_explorer.py tests/test_crow_canonical.py tests/test_crow_cad_text.py tests/test_workbench.py >>"$LOG" 2>&1
            RC=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$RC" -eq 0 ]; then
            echo 'RESULT success' >>"$LOG"
            git add -- src/crow_workbench/app.py tests/test_workbench.py tests/test_crow_canonical.py
            git add -u -- src/crow_canonical/vent_adapter.py
            git diff --cached --check >>"$LOG" 2>&1 || RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            git commit -m "refactor(core): remove Vent runtime dependency [pass106-result]"
            git push origin HEAD:pass106-core-vent-decoupling-clean
            exit $?
          fi

          echo "RESULT failure rc=$RC" >>"$LOG"
          git reset --hard HEAD >/dev/null 2>&1
          cp "$LOG" .pass106-failure.log
          git add -- .pass106-failure.log
          git commit -m "chore(pass106): record migration failure [pass106-result]"
          git push origin HEAD:pass106-core-vent-decoupling-clean
          exit 0

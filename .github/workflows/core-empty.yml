name: Core without modules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core-empty:
    name: Core empty installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install platform only (no first-party modules)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify no business module is installed
        run: |
          python - <<'PY'
          from importlib.metadata import entry_points
          plugins = list(entry_points(group="crow.modules"))
          assert not plugins, f"Unexpected business modules: {plugins}"
          print("PASS: no crow.modules entry points installed")
          PY
      - name: Boot core shell without business modules
        env:
          CROW_AUTH_MODE: session
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from fastapi.testclient import TestClient
          from crow_module_sdk.module_registry import ModuleRegistry
          from crow_workbench.shell import create_app

          assert not ModuleRegistry().discover(), "Core discovered business modules"
          with TemporaryDirectory() as temp:
              root = Path(temp)
              app = create_app(data_root=root / "data", config_root=root / "config")
              with TestClient(app) as client:
                  health = client.get("/health")
                  assert health.status_code == 200, (
                      f"Core health failed: {health.status_code} {health.text[:300]}"
                  )
                  login = client.get("/login", follow_redirects=False)
                  assert login.status_code == 200, (
                      f"Core login failed: {login.status_code}"
                  )
          print("PASS: core boot, health and login without business modules")
          PY

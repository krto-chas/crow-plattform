name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install first-party modules
        run: |
          set -euo pipefail
          for module in modules/*; do
            if [ -f "$module/pyproject.toml" ]; then
              python -m pip install -e "$module"
            fi
          done
      - name: Pass 96 formatter migration
        run: |
          ruff format .
          git diff --name-only -z | tar --null -T - -czf pass96-formatted-files.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pass96-formatted-files
          path: pass96-formatted-files.tar.gz
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - name: Type-check first-party modules
        run: |
          mypy --strict \
            modules/crow-vent-module/src \
            modules/crow-vent-module/tests \
            modules/crow-pressure-test-module/src \
            modules/crow-pressure-test-module/tests \
            modules/crow-ovk-module/src \
            modules/crow-ovk-module/tests
      - run: pytest -q
      - name: Architecture review
        run: python -m crow_module_conformance.cli review --root .
      - name: Build distribution
        run: python -m pip install build && python -m build

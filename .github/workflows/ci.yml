name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install first-party modules
        run: |
          set -euo pipefail
          for module in modules/*; do
            if [ -f "$module/pyproject.toml" ]; then
              python -m pip install -e "$module"
            fi
          done
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - name: Type-check first-party modules
        run: |
          mypy --strict \
            modules/crow-vent-module/src \
            modules/crow-vent-module/tests \
            modules/crow-pressure-test-module/src \
            modules/crow-pressure-test-module/tests \
            modules/crow-ovk-module/src \
            modules/crow-ovk-module/tests
      - run: pytest -q
      - name: Architecture review
        run: python -m crow_module_conformance.cli review --root .
      - name: Build distribution
        run: python -m pip install build && python -m build
      - name: Container deployment smoke
        env:
          CROW_SESSION_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          docker compose config >/dev/null
          docker build -t crow-platform:ci .
          docker run --detach --name crow-platform-ci \
            --env CROW_AUTH_MODE=session \
            --env CROW_SESSION_SECRET="$CROW_SESSION_SECRET" \
            --env CROW_COOKIE_SECURE=false \
            --publish 127.0.0.1:18080:8080 \
            crow-platform:ci
          cleanup() {
            docker rm -f crow-platform-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs crow-platform-ci
          exit 1

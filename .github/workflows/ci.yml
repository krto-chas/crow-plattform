name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install first-party modules
        run: |
          set -euo pipefail
          for module in modules/*; do
            if [ -f "$module/pyproject.toml" ]; then
              python -m pip install -e "$module"
            fi
          done
      - name: Pass 96 apply formatter migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/pass96-full-gate-alignment'
        run: |
          ruff format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Pass 96 apply Ruff formatting"
            git push origin HEAD:agent/pass96-full-gate-alignment
          fi
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - name: Type-check first-party modules
        run: |
          mypy --strict \
            modules/crow-vent-module/src \
            modules/crow-vent-module/tests \
            modules/crow-pressure-test-module/src \
            modules/crow-pressure-test-module/tests \
            modules/crow-ovk-module/src \
            modules/crow-ovk-module/tests
      - run: pytest -q
      - name: Architecture review
        run: python -m crow_module_conformance.cli review --root .
      - name: Build distribution
        run: python -m pip install build && python -m build

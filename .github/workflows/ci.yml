name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install first-party modules
        run: |
          set -euo pipefail
          for module in modules/*; do
            if [ -f "$module/pyproject.toml" ]; then
              python -m pip install -e "$module"
            fi
          done
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - name: Type-check first-party modules
        run: |
          mypy --strict \
            modules/crow-vent-module/src \
            modules/crow-vent-module/tests \
            modules/crow-pressure-test-module/src \
            modules/crow-pressure-test-module/tests \
            modules/crow-ovk-module/src \
            modules/crow-ovk-module/tests
      - run: pytest -q
      - name: Architecture review
        run: python -m crow_module_conformance.cli review --root .
      - name: Build distribution
        run: python -m pip install build && python -m build
      - name: Deployment operations validation
        run: |
          set -euo pipefail
          bash -n deploy/*.sh deploy/lib/*.sh tests/deployment_backup_restore.sh
          ./tests/deployment_backup_restore.sh
      - name: HTTPS stack startup smoke
        env:
          CROW_SESSION_SECRET: 0123456789abcdef0123456789abcdef
          CROW_PLATFORM_UID: 0
          CROW_PLATFORM_GID: 0
          CROW_PLATFORM_BIND_ADDRESS: 127.0.0.1
          CROW_PLATFORM_PORT: 18080
          CROW_PROXY_BIND_ADDRESS: 127.0.0.1
          CROW_PROXY_HTTP_PORT: 18081
          CROW_PROXY_HTTPS_PORT: 18443
          CROW_PROXY_SITE: crow.localhost
          CROW_COOKIE_SECURE: "true"
          CROW_PLATFORM_DATA_DIR: /tmp/crow-platform-ci/data
          CROW_PLATFORM_CONFIG_DIR: /tmp/crow-platform-ci/config
          CROW_PLATFORM_BACKUP_DIR: /tmp/crow-platform-ci/backups
        run: |
          set -euo pipefail
          mkdir -p "$CROW_PLATFORM_DATA_DIR" "$CROW_PLATFORM_CONFIG_DIR" "$CROW_PLATFORM_BACKUP_DIR"
          docker compose config >/dev/null
          docker compose up -d --build
          docker compose ps crow-platform crow-proxy
          curl --fail --silent http://127.0.0.1:18080/health >/dev/null
          docker compose exec -T crow-platform python -c \
            "import os; assert os.environ['CROW_COOKIE_SECURE'].lower() == 'true'"
          docker compose exec -T crow-proxy caddy version | grep -q 'v2.11.4'
          docker compose down

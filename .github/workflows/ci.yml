name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install first-party modules
        run: |
          set -euo pipefail
          for module in modules/*; do
            if [ -f "$module/pyproject.toml" ]; then
              python -m pip install -e "$module"
            fi
          done
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - name: Type-check first-party modules
        run: |
          mypy --strict \
            modules/crow-vent-module/src \
            modules/crow-vent-module/tests \
            modules/crow-pressure-test-module/src \
            modules/crow-pressure-test-module/tests \
            modules/crow-ovk-module/src \
            modules/crow-ovk-module/tests
      - run: pytest -q
      - name: Architecture review
        run: python -m crow_module_conformance.cli review --root .
      - name: Build distribution
        run: python -m pip install build && python -m build
      - name: Deployment operations validation
        run: |
          set -euo pipefail
          bash -n deploy/*.sh deploy/lib/*.sh tests/deployment_backup_restore.sh
          ./tests/deployment_backup_restore.sh
      - name: Prepare HTTPS stack smoke
        run: |
          cat >>"$GITHUB_ENV" <<'EOF'
          CROW_SESSION_SECRET=0123456789abcdef0123456789abcdef
          CROW_PLATFORM_UID=0
          CROW_PLATFORM_GID=0
          CROW_PLATFORM_BIND_ADDRESS=127.0.0.1
          CROW_PLATFORM_PORT=18080
          CROW_PROXY_BIND_ADDRESS=127.0.0.1
          CROW_PROXY_HTTP_PORT=18081
          CROW_PROXY_HTTPS_PORT=18443
          CROW_PROXY_SITE=crow.localhost
          CROW_COOKIE_SECURE=true
          CROW_PLATFORM_DATA_DIR=/tmp/crow-platform-ci/data
          CROW_PLATFORM_CONFIG_DIR=/tmp/crow-platform-ci/config
          CROW_PLATFORM_BACKUP_DIR=/tmp/crow-platform-ci/backups
          EOF
          mkdir -p /tmp/crow-platform-ci/data /tmp/crow-platform-ci/config /tmp/crow-platform-ci/backups
      - name: Validate HTTPS Compose config
        run: docker compose config >/dev/null
      - name: Start HTTPS stack
        run: docker compose up -d --build
      - name: Inspect HTTPS stack
        run: docker compose ps -a crow-platform crow-proxy
      - name: Verify backend health
        run: curl --fail --silent http://127.0.0.1:18080/health >/dev/null
      - name: Verify secure-cookie mode
        run: |
          docker compose exec -T crow-platform python -c \
            "import os; assert os.environ['CROW_COOKIE_SECURE'].lower() == 'true'"
      - name: Inspect Caddy startup logs
        run: docker compose logs --no-color crow-proxy
      - name: Verify Caddy version
        run: docker compose exec -T crow-proxy caddy version | grep -q 'v2.11.4'
      - name: Stop HTTPS stack
        if: always()
        run: docker compose down || true

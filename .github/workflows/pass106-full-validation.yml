name: Pass106 full validation

on:
  push:
    branches: [pass106-core-vent-decoupling-clean]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[pass106-full-ci-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pass106-core-vent-decoupling-clean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full CI-equivalent validation
        shell: bash
        run: |
          set +e
          LOG=/tmp/pass106-full-ci.log
          : >"$LOG"
          RC=0

          run_phase() {
            local name="$1"
            shift
            if [ "$RC" -ne 0 ]; then
              return
            fi
            echo "PHASE $name" >>"$LOG"
            "$@" >>"$LOG" 2>&1
            local code=$?
            if [ "$code" -ne 0 ]; then
              RC=$code
              echo "FAILED $name rc=$code" >>"$LOG"
            fi
          }

          run_phase pip-upgrade python -m pip install --upgrade pip
          run_phase install-root python -m pip install -e ".[dev]"

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE install-first-party-modules' >>"$LOG"
            for module in modules/*; do
              if [ -f "$module/pyproject.toml" ]; then
                python -m pip install -e "$module" >>"$LOG" 2>&1
                code=$?
                if [ "$code" -ne 0 ]; then
                  RC=$code
                  echo "FAILED install-first-party-modules module=$module rc=$code" >>"$LOG"
                  break
                fi
              fi
            done
          fi

          run_phase ruff-format ruff format --check .
          run_phase ruff-check ruff check .
          run_phase mypy-root mypy

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE mypy-modules-strict' >>"$LOG"
            mypy --strict \
              modules/crow-vent-module/src \
              modules/crow-vent-module/tests \
              modules/crow-pressure-test-module/src \
              modules/crow-pressure-test-module/tests \
              modules/crow-ovk-module/src \
              modules/crow-ovk-module/tests >>"$LOG" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              RC=$code
              echo "FAILED mypy-modules-strict rc=$code" >>"$LOG"
            fi
          fi

          run_phase pytest pytest -q
          run_phase architecture-review python -m crow_module_conformance.cli review --root .
          run_phase build-install python -m pip install build
          run_phase build-distribution python -m build

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE deployment-operations' >>"$LOG"
            bash -n deploy/*.sh deploy/lib/*.sh tests/deployment_backup_restore.sh >>"$LOG" 2>&1 && \
              ./tests/deployment_backup_restore.sh >>"$LOG" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              RC=$code
              echo "FAILED deployment-operations rc=$code" >>"$LOG"
            fi
          fi

          export CROW_PLATFORM_BIND_ADDRESS=127.0.0.1
          export CROW_PLATFORM_PORT=18080
          export CROW_PROXY_BIND_ADDRESS=127.0.0.1
          export CROW_PROXY_HTTP_PORT=18081
          export CROW_PROXY_HTTPS_PORT=18443
          export CROW_PROXY_SITE=crow.localhost
          export CROW_COOKIE_SECURE=true
          export CROW_PLATFORM_DATA_DIR=/tmp/crow-platform-ci/data
          export CROW_PLATFORM_CONFIG_DIR=/tmp/crow-platform-ci/config
          export CROW_PLATFORM_BACKUP_DIR=/tmp/crow-platform-ci/backups
          export CROW_SESSION_SECRET_PATH=/tmp/crow-platform-ci/session-secret
          export CROW_PLATFORM_UID="$(id -u)"
          export CROW_PLATFORM_GID="$(id -g)"
          mkdir -p /tmp/crow-platform-ci/data /tmp/crow-platform-ci/config /tmp/crow-platform-ci/backups
          printf '%s\n' '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' >/tmp/crow-platform-ci/session-secret
          chmod 0400 /tmp/crow-platform-ci/session-secret

          run_phase compose-config docker compose config
          run_phase compose-up docker compose up -d --build
          run_phase compose-ps docker compose ps -a crow-platform crow-proxy
          run_phase backend-health curl --fail --silent http://127.0.0.1:18080/health

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE secure-cookie' >>"$LOG"
            docker compose exec -T crow-platform python -c \
              "import os; assert os.environ['CROW_COOKIE_SECURE'].lower() == 'true'" >>"$LOG" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              RC=$code
              echo "FAILED secure-cookie rc=$code" >>"$LOG"
            fi
          fi

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE caddy-logs' >>"$LOG"
            docker compose logs --no-color crow-proxy >>"$LOG" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              RC=$code
              echo "FAILED caddy-logs rc=$code" >>"$LOG"
            fi
          fi

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE https-route' >>"$LOG"
            docker compose exec -T crow-proxy cat /data/caddy/pki/authorities/local/root.crt >/tmp/crow-caddy-root.crt 2>>"$LOG" && \
              curl --noproxy '*' --fail --silent \
                --cacert /tmp/crow-caddy-root.crt \
                --resolve crow.localhost:18443:127.0.0.1 \
                https://crow.localhost:18443/health >>"$LOG" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              RC=$code
              echo "FAILED https-route rc=$code" >>"$LOG"
            fi
          fi

          if [ "$RC" -eq 0 ]; then
            echo 'PHASE caddy-version' >>"$LOG"
            docker compose exec -T crow-proxy caddy version 2>>"$LOG" | grep -q 'v2.11.4'
            code=$?
            if [ "$code" -ne 0 ]; then
              RC=$code
              echo "FAILED caddy-version rc=$code" >>"$LOG"
            fi
          fi

          echo 'PHASE compose-down' >>"$LOG"
          docker compose down >>"$LOG" 2>&1 || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$RC" -eq 0 ]; then
            echo 'RESULT success' >>"$LOG"
            git rm -- .github/workflows/pass106-full-validation.yml .pass106-ci-trigger
            git commit -m "chore(pass106): remove validation harness [pass106-full-ci-pass]"
            git push origin HEAD:pass106-core-vent-decoupling-clean
            exit $?
          fi

          echo "RESULT failure rc=$RC" >>"$LOG"
          cp "$LOG" .pass106-full-ci-failure.log
          git add -- .pass106-full-ci-failure.log
          git commit -m "chore(pass106): record full CI failure [pass106-full-ci-fail]"
          git push origin HEAD:pass106-core-vent-decoupling-clean
          exit 0

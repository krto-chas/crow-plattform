name: Pass106 workflow trigger probe

on:
  push:
    branches: [pass106-core-vent-decoupling-clean]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pass106-core-vent-decoupling-clean
      - name: Record execution
        run: |
          printf '%s\n' "$GITHUB_SHA" > .pass106-workflow-probe
          git config user.name "Crow Pass106 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- .pass106-workflow-probe
          git commit -m "chore(pass106): confirm workflow execution"
          git push origin HEAD:pass106-core-vent-decoupling-clean

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crow OVK · Legacyimport</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#16202a;background:#eef2f4}*{box-sizing:border-box}body{margin:0}.top{background:#17202a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;gap:12px}.top a{color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d8e0e6;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}input,select,button,textarea{font:inherit;border-radius:9px}input,select,textarea{width:100%;padding:10px;border:1px solid #bcc8d1;background:#fff}button{padding:11px 14px;border:0;background:#17202a;color:#fff;font-weight:750;cursor:pointer}.alt{background:#fff;color:#17202a;border:1px solid #aeb9c3}.good{background:#176b3a}.danger{background:#8a2b2b}.status{padding:10px;border-radius:9px;background:#edf1f4}.pass{background:#e4f5e9}.warn{background:#fff2cc}.file{border-top:1px solid #dce3e8;padding-top:14px;margin-top:14px}.fact,.review{display:grid;grid-template-columns:auto 160px 1fr 1.2fr;gap:8px;align-items:start;border:1px solid #dce3e8;border-radius:9px;padding:9px;margin:7px 0;font-size:13px}.review{grid-template-columns:auto 160px 1fr 1.4fr}.source{color:#62717d;font-size:11px;word-break:break-word}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf1f4;font-size:11px}@media(max-width:720px){.grid,.fact,.review{grid-template-columns:1fr}.wrap{padding:10px}}
  </style>
</head>
<body>
<header class="top"><strong>Crow OVK · Historikimport</strong><a href="/ovk/besiktning">Till OVK Workbench</a></header>
<main class="wrap">
  <section class="card">
    <h1>Importera äldre OVK-protokoll</h1>
    <p>PDF och XLSX analyseras först som preview. Ingenting skrivs till fastighetshistoriken förrän du granskat materialet och väljer commit.</p>
    <div class="grid">
      <div><label>Projekt-ID</label><input id="project" placeholder="fastighet-123"></div>
      <div><label>Besiktningsman / importansvarig</label><input id="inspector" placeholder="Namn"></div>
      <div class="wide"><label>Protokollfiler</label><input id="files" type="file" accept=".pdf,.xlsx" multiple></div>
    </div>
    <div class="actions" style="margin-top:12px"><button id="preview">Skapa previews</button><button id="commitAll" class="good">Commit:a alla färdiggranskade</button></div>
    <div id="globalStatus" class="status" style="margin-top:12px">Ingen import startad.</div>
  </section>
  <section id="queue"></section>
</main>
<script src="/ovk/legacy/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crow Platform</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #18202a;
      background: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      background: #111820;
      color: white;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand strong { font-size: 20px; letter-spacing: .05em; }
    .brand span { color: #8ea0b0; font-size: 12px; }
    nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    nav a, nav button {
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #dce4ea;
      padding: 8px 10px;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    nav a.active { background: #25313d; color: white; }
    nav button { border: 1px solid #3a4652; }
    main { max-width: 1220px; margin: 0 auto; padding: 34px 24px 72px; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    h2 { margin: 34px 0 14px; font-size: 21px; }
    h3 { margin: 0 0 8px; }
    p { line-height: 1.5; }
    .muted { color: #647180; }
    .eyebrow { color: #6d7a86; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }
    .identity-card {
      min-width: 245px;
      background: #e9eef2;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .card {
      background: white;
      border: 1px solid #dce2e8;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(20, 30, 40, .04);
    }
    .module-card { display: flex; flex-direction: column; min-height: 190px; }
    .module-card .actions { margin-top: auto; padding-top: 16px; }
    .stat strong { display: block; font-size: 30px; line-height: 1; margin-bottom: 8px; }
    .pill {
      display: inline-block;
      border-radius: 999px;
      background: #eef2f5;
      padding: 4px 9px;
      font-size: 12px;
      margin: 0 6px 6px 0;
    }
    .pill.good { background: #e7f4e9; color: #245f31; }
    .pill.warn { background: #fff3df; color: #80530d; }
    .pill.bad { background: #fff0f0; color: #8a2626; }
    a.button, button.primary {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      background: #1d5b79;
      color: white;
      padding: 9px 13px;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    button.secondary, a.secondary {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      background: #e8edf1;
      color: #25313d;
      padding: 9px 13px;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .split {
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(360px, 1.2fr);
      gap: 20px;
      margin-top: 18px;
    }
    .customer {
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      border: 1px solid #dce2e8;
      border-radius: 8px;
      background: #f7f9fa;
      color: #25313d;
      padding: 11px 12px;
      cursor: pointer;
    }
    .customer:hover, .customer.selected { border-color: #8ca8b8; background: #edf3f6; }
    .module-row {
      display: grid;
      grid-template-columns: 28px 1fr minmax(145px, auto);
      gap: 10px;
      align-items: start;
      padding: 12px 0;
      border-bottom: 1px solid #edf0f2;
    }
    .module-row:last-child { border-bottom: 0; }
    input[type="text"], input[type="date"] {
      width: 100%;
      border: 1px solid #cbd4dc;
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
    }
    .create-customer { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 16px; }
    .error, .ok {
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
    }
    .error { background: #fff0f0; border: 1px solid #f0caca; color: #8a2626; }
    .ok { background: #eef8f0; border: 1px solid #cce4d0; color: #245f31; }
    .empty { border: 1px dashed #c9d1d8; border-radius: 10px; padding: 20px; background: #fafbfc; }
    @media (max-width: 800px) {
      header, .hero { align-items: flex-start; flex-direction: column; }
      .split { grid-template-columns: 1fr; }
      .identity-card { width: 100%; }
      .module-row { grid-template-columns: 28px 1fr; }
      .module-row input[type="date"] { grid-column: 2; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><strong>CROW PLATFORM</strong><span>Decision Intelligence</span></div>
    <nav id="nav"></nav>
  </header>
  <main id="content"><p class="muted">Laddar…</p></main>
  <script>
    const content = document.getElementById("content");
    const nav = document.getElementById("nav");
    let selectedCustomer = null;

    async function json(url, options = {}) {
      const response = await fetch(url, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = typeof payload.detail === "string"
          ? payload.detail
          : JSON.stringify(payload.detail || payload);
        throw new Error(detail || `HTTP ${response.status}`);
      }
      return payload;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderNav(session) {
      const admin = session.roles.includes("platform-admin");
      const links = [
        `<a href="/app" class="${location.pathname === "/app" ? "active" : ""}">Min Crow</a>`,
        admin ? `<a href="/admin" class="${location.pathname === "/admin" ? "active" : ""}">Admin</a>` : "",
        '<a href="/workbench">Workbench</a>'
      ];
      if (session.auth_mode === "session") {
        links.push('<button type="button" id="logout">Logga ut</button>');
      }
      nav.innerHTML = links.join("");
      document.getElementById("logout")?.addEventListener("click", logout);
    }

    async function logout() {
      await fetch("/api/auth/logout", {method: "POST"});
      location.replace("/login");
    }

    function identityMarkup(session) {
      return `<div class="identity-card">
        <div class="eyebrow">Aktiv identitet</div>
        <strong>${escapeHtml(session.user_id || "lokal användare")}</strong><br>
        <span class="muted">Kund: ${escapeHtml(session.customer_id)}</span>
      </div>`;
    }

    async function boot() {
      try {
        const session = await json("/api/session");
        renderNav(session);
        if (location.pathname === "/admin") {
          await renderAdmin(session);
        } else {
          await renderApp(session);
        }
      } catch (error) {
        content.innerHTML = `<h1>Crow Platform</h1><div class="error">${escapeHtml(error.message)}</div>`;
      }
    }

    async function renderApp(session) {
      const data = await json("/api/me/modules");
      const cards = data.modules.map(module => `
        <article class="card module-card">
          <div class="eyebrow">Produktmodul</div>
          <h3>${escapeHtml(module.name)}</h3>
          <p class="muted">${escapeHtml(module.id)}</p>
          ${module.data_dependencies.length ? `<p><span class="pill">Data: ${escapeHtml(module.data_dependencies.join(", "))}</span></p>` : ""}
          <div class="actions"><a class="button" href="${escapeHtml(module.route)}">Öppna modul</a></div>
        </article>`).join("");

      content.innerHTML = `
        <section class="hero">
          <div>
            <div class="eyebrow">Kundarbetsyta</div>
            <h1>Min Crow</h1>
            <p class="muted">Dina projekt och de produktmoduler som är aktiverade för organisationen.</p>
          </div>
          ${identityMarkup(session)}
        </section>
        <div class="grid">
          <article class="card module-card">
            <div class="eyebrow">Gemensam arbetsyta</div>
            <h3>Projekt & Workbench</h3>
            <p class="muted">Öppna den gemensamma projektarbetsytan för import, evidens och projektdata.</p>
            <div class="actions"><a class="button secondary" href="/workbench">Öppna Workbench</a></div>
          </article>
          ${cards || `<article class="card"><div class="eyebrow">Produktmoduler</div><h3>Inga aktiva moduler</h3><p class="muted">Administratören har ännu inte aktiverat någon produktmodul för denna kund.</p></article>`}
        </div>`;
    }

    async function renderAdmin(session) {
      if (!session.roles.includes("platform-admin")) {
        location.replace("/app");
        return;
      }
      const [customerData, moduleData] = await Promise.all([
        json("/api/admin/customers"),
        json("/api/admin/modules")
      ]);
      const activeProducts = moduleData.modules.filter(module => module.status === "active").length;
      const runtimeLinked = moduleData.modules.filter(module => module.runtime_installed === true).length;

      content.innerHTML = `
        <section class="hero">
          <div>
            <div class="eyebrow">Plattformsadministration</div>
            <h1>Administration</h1>
            <p class="muted">Hantera kunder och modulåtkomst utan att ändra deployment eller applikationskod.</p>
          </div>
          ${identityMarkup(session)}
        </section>
        <div class="grid">
          <article class="card stat"><strong>${customerData.customers.length}</strong><span class="muted">Konfigurerade kunder</span></article>
          <article class="card stat"><strong>${activeProducts}</strong><span class="muted">Aktiva produktmoduler</span></article>
          <article class="card stat"><strong>${runtimeLinked}</strong><span class="muted">Produktmoduler kopplade till runtime</span></article>
          <article class="card stat"><strong>${moduleData.runtime_modules.length}</strong><span class="muted">Upptäckta runtime-moduler</span></article>
        </div>

        <h2>Kunder & åtkomst</h2>
        <div class="split">
          <section class="card">
            <form id="customer-create" class="create-customer">
              <input id="new-customer-id" type="text" placeholder="ny-kund" pattern="[a-z0-9][a-z0-9_-]{0,119}" required>
              <button class="primary" type="submit">Skapa kund</button>
            </form>
            <div id="customer-create-message"></div>
            <div id="customers"></div>
          </section>
          <section class="card">
            <h3 id="customer-title">Välj kund</h3>
            <p class="muted" id="customer-help">Välj en kund till vänster för att styra produktmoduler.</p>
            <form id="entitlement-form">
              <div id="entitlements"></div>
              <div class="toolbar"><button class="primary" type="submit" id="save" hidden>Spara åtkomst</button></div>
              <div id="message"></div>
            </form>
          </section>
        </div>

        <h2>Produkt- och runtime-moduler</h2>
        <div class="grid">${moduleData.modules.map(module => `
          <article class="card">
            <div class="eyebrow">${escapeHtml(module.id)}</div>
            <h3>${escapeHtml(module.name)}</h3>
            <p>
              <span class="pill ${module.status === "active" ? "good" : "warn"}">${escapeHtml(module.status)}</span>
              ${module.runtime_installed === true ? '<span class="pill good">installerad</span>' : module.runtime_installed === false ? '<span class="pill bad">saknas i runtime</span>' : '<span class="pill">runtime ej kopplad</span>'}
            </p>
            <p class="muted">${module.requires_modules.length ? `Kräver: ${escapeHtml(module.requires_modules.join(", "))}` : "Inga kommersiella modulberoenden."}</p>
          </article>`).join("")}</div>`;

      bindCustomerList(customerData.customers, moduleData.modules);
      document.getElementById("entitlement-form").addEventListener("submit", event => saveCustomer(event, moduleData.modules));
      document.getElementById("customer-create").addEventListener("submit", event => createCustomer(event, moduleData.modules));
    }

    function bindCustomerList(customersData, modules) {
      const customers = document.getElementById("customers");
      customers.innerHTML = customersData.map(customer => `
        <button type="button" class="customer" data-customer="${escapeHtml(customer.customer_id)}">
          <strong>${escapeHtml(customer.customer_id)}</strong><br>
          <span class="muted">${escapeHtml(customer.active_modules.join(", ") || "inga aktiva moduler")}</span>
        </button>`).join("") || '<div class="empty"><strong>Inga kunder ännu</strong><p class="muted">Skapa den första kunden ovan.</p></div>';

      customers.querySelectorAll("button[data-customer]").forEach(button => {
        button.addEventListener("click", () => loadCustomer(button.dataset.customer, modules));
      });
    }

    async function createCustomer(event, modules) {
      event.preventDefault();
      const input = document.getElementById("new-customer-id");
      const message = document.getElementById("customer-create-message");
      const customerId = input.value.trim().toLowerCase();
      message.innerHTML = "";
      try {
        const created = await json("/api/admin/customers", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({customer_id: customerId})
        });
        const data = await json("/api/admin/customers");
        bindCustomerList(data.customers, modules);
        input.value = "";
        message.innerHTML = `<div class="ok">Kunden ${escapeHtml(created.customer_id)} skapades.</div>`;
        await loadCustomer(created.customer_id, modules);
      } catch (error) {
        message.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      }
    }

    async function loadCustomer(customerId, modules) {
      selectedCustomer = customerId;
      const data = await json(`/api/admin/customers/${encodeURIComponent(customerId)}/entitlements`);
      const configured = new Map(data.modules.map(item => [item.id, item]));
      document.getElementById("customer-title").textContent = `Åtkomst · ${customerId}`;
      document.getElementById("customer-help").textContent = "Aktivera endast produktmoduler kunden ska kunna använda.";
      document.getElementById("save").hidden = false;
      document.getElementById("message").innerHTML = "";
      document.querySelectorAll(".customer").forEach(button => {
        button.classList.toggle("selected", button.dataset.customer === customerId);
      });
      document.getElementById("entitlements").innerHTML = modules.map(module => {
        const entry = configured.get(module.id) || {active: false, valid_until: null};
        const disabled = module.status !== "active";
        return `<label class="module-row">
          <input type="checkbox" name="module" value="${escapeHtml(module.id)}" ${entry.active ? "checked" : ""} ${disabled ? "disabled" : ""}>
          <span>
            <strong>${escapeHtml(module.name)}</strong><br>
            <span class="muted">${escapeHtml(module.id)}${module.requires_modules.length ? ` · kräver ${escapeHtml(module.requires_modules.join(", "))}` : ""}</span>
          </span>
          <input type="date" aria-label="Giltig till för ${escapeHtml(module.name)}" data-valid-until="${escapeHtml(module.id)}" value="${escapeHtml(entry.valid_until || "")}" ${disabled ? "disabled" : ""}>
        </label>`;
      }).join("");
    }

    async function saveCustomer(event, modules) {
      event.preventDefault();
      if (!selectedCustomer) return;
      const form = event.currentTarget;
      const entries = modules.filter(module => module.status === "active").map(module => {
        const checked = form.querySelector(`input[name="module"][value="${CSS.escape(module.id)}"]`).checked;
        const validUntil = form.querySelector(`input[data-valid-until="${CSS.escape(module.id)}"]`).value;
        return {id: module.id, active: checked, valid_until: validUntil || null};
      });
      const message = document.getElementById("message");
      try {
        await json(`/api/admin/customers/${encodeURIComponent(selectedCustomer)}/entitlements`, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({modules: entries})
        });
        message.innerHTML = '<div class="ok">Åtkomsten är sparad.</div>';
      } catch (error) {
        message.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      }
    }

    boot();
  </script>
</body>
</html>

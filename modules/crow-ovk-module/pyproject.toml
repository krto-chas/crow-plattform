[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crow-ovk-module"
version = "1.0.0"
description = "Crow OVK domain module"
requires-python = ">=3.11"
dependencies = [
    "crow-plattform>=0.7.0a1,<0.8",
    "openpyxl>=3.1",
    "pypdf>=5.0",
]

[project.entry-points."crow.modules"]
ovk = "crow_ovk_module.plugin:CrowOvkModulePlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crow_ovk_module = ["py.typed", "assets/*.html", "assets/*.js"]
crow_ovk = ["py.typed"]
crow_ovk_field = ["py.typed", "defect_types.json"]
crow_ovk_workflow = ["py.typed"]
crow_ovk_import = ["py.typed"]
crow_ovk_legacy = ["py.typed"]
crow_ovk_pricing = ["py.typed", "ovk_taxa_lexikon.json"]

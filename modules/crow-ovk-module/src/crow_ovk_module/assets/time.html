<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crow OVK · Tid</title><style>body{font-family:system-ui,sans-serif;background:#eef2f4;color:#17202a;margin:0}.wrap{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d8e0e6;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #bcc8d1;font:inherit}button{background:#17202a;color:white;font-weight:700;margin-top:8px}.alt{background:white;color:#17202a}.status{background:#edf1f4;padding:12px;border-radius:9px;margin-top:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><h1>OVK · Tid</h1><p><a href="/ovk/besiktning">Till besiktning</a></p>
<section class="card"><h2>Besiktning</h2><div class="grid"><div><label>ID</label><input id="inspection"></div><div><label>Projekt</label><input id="project"></div><div><label>Datum</label><input id="date" type="date"></div><div><label>Användare</label><input id="user"></div></div><button id="load">Läs tidsledger</button><div id="summary" class="status">Ingen ledger laddad.</div></section>
<section class="card"><h2>Arbetstid i Workbench</h2><div class="grid"><button id="reviewStart">Starta REVIEW</button><button id="reviewStop" class="alt">Stoppa REVIEW</button><button id="protocolStart">Starta PROTOCOL</button><button id="protocolStop" class="alt">Stoppa PROTOCOL</button></div><div id="timer" class="status">Ingen aktiv timer.</div></section>
<section class="card"><h2>Manuell justering</h2><div class="grid"><div><label>Timmar (+/-)</label><input id="hours" type="number" step="0.01"></div><div><label>Orsak</label><input id="reason"></div></div><button id="adjust">Lägg till justering</button></section>
</main><script src="/ovk/tid/app.js"></script></body></html>

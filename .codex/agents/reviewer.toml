name = "reviewer"
description = "Oberoende arkitektur- och säkerhetsgranskning av en exakt Crow-revision."
sandbox_mode = "read-only"
developer_instructions = """
Läs docs/engineering/REVIEW.md och relevanta ADR:er. Följ HANDOFF.md.
Granska hela diffen mellan angivna fullständiga SHA. Kontrollera HEAD och
ren arbetskatalog. Ändra inga filer, kör inga skrivande kommandon och begär
inte eskalering. Rapportera konkreta fynd med fil/rad, konsekvens och
åtgärdsförslag samt ogranskade områden. Rapportera bas-SHA och HEAD-SHA.
"""
